<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Maker 🤑 - Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #212121; color: #ececec; }
        .sidebar { background-color: #171717; }
        .emerald-accent { color: #10b981; border-color: #10b981; }
        .emerald-bg { background-color: #10b981; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #424242; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .tab-active { border-bottom: 2px solid #10b981; color: #10b981; }
        #terminal-container, #terminal-chat-container { background: #000; border-radius: 8px; overflow: hidden; }
        .skill-card { background: #2f2f2f; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .skill-card:hover { border-color: #10b981; }
        .config-card { background: #2f2f2f; border-radius: 1rem; padding: 1.5rem; border: 1px solid rgba(255,255,255,0.1); }
        input[type="text"], input[type="password"], textarea { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.75rem; padding: 0.75rem 1rem; width: 100%; outline: none; transition: border-color 0.2s; }
        input:focus, textarea:focus { border-color: #10b981; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <div class="sidebar w-64 flex flex-col h-full hidden md:flex border-r border-white/10">
        <div class="p-4 flex items-center gap-3">
            <div class="emerald-bg p-2 rounded-lg">
                <i data-lucide="trending-up" class="text-white w-6 h-6"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-white">Money Maker <span class="text-emerald-500">🤑</span></span>
        </div>

        <div class="px-3 mt-4">
            <button onclick="location.reload()" class="w-full flex items-center gap-2 px-4 py-3 border border-white/20 rounded-xl hover:bg-white/5 transition text-sm font-medium text-white">
                <i data-lucide="plus" class="w-4 h-4"></i>
                New Chat
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-3 mt-6 space-y-1" id="chat-history">
            <div class="text-xs font-semibold text-gray-500 px-4 py-2 uppercase tracking-wider">Agent Status</div>
            <div id="agent-status-card" class="px-4 py-3 bg-white/5 rounded-xl border border-white/5 mx-1">
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-2 h-2 rounded-full bg-yellow-500" id="status-dot"></div>
                    <span id="status-text" class="text-xs font-bold text-gray-300">Initializing...</span>
                </div>
                <div class="text-[10px] text-gray-500 font-mono">Build v2029.4.MM</div>
            </div>
        </div>

        <div class="p-4 border-t border-white/10">
            <div class="flex items-center gap-3 p-2 hover:bg-white/5 rounded-lg cursor-pointer transition text-white" onclick="showPage('api')">
                <div class="w-8 h-8 rounded-full emerald-bg flex items-center justify-center font-bold text-xs">MM</div>
                <div class="flex-1 text-sm font-medium">Control Center</div>
                <i data-lucide="settings" class="w-4 h-4 text-gray-400"></i>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full bg-[#212121]">
        <header class="h-14 border-b border-white/5 flex items-center justify-between px-6 shrink-0 bg-[#212121]">
            <div class="flex items-center gap-6">
                <nav class="flex gap-4 text-sm font-medium text-gray-400">
                    <button onclick="showPage('chat')" class="nav-btn py-4 px-2 tab-active" id="btn-chat">Chat</button>
                    <button onclick="showPage('skills')" class="nav-btn py-4 px-2 hover:text-white" id="btn-skills">Capabilities</button>
                    <button onclick="showPage('logs')" class="nav-btn py-4 px-2 hover:text-white" id="btn-logs">Terminal</button>
                    <button onclick="showPage('api')" class="nav-btn py-4 px-2 hover:text-white" id="btn-api">Config</button>
                </nav>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="location.reload()" class="p-2 hover:bg-white/5 rounded-full" title="Refresh"><i data-lucide="refresh-cw" class="w-4 h-4 text-gray-400"></i></button>
            </div>
        </header>

        <main class="flex-1 overflow-hidden relative">
            <!-- Chat Page -->
            <div id="page-chat" class="h-full flex flex-col max-w-5xl mx-auto w-full px-6 pt-6">
                <div class="flex-1 flex flex-col mb-6">
                    <div id="terminal-chat-container" class="flex-1 bg-black rounded-2xl overflow-hidden border border-white/10 shadow-2xl"></div>
                </div>
                <div class="text-[10px] text-center text-gray-500 mb-6 uppercase tracking-widest font-bold">
                    Autonomous Intelligence Interface · Money Maker 🤑
                </div>
            </div>

            <!-- Skills Page -->
            <div id="page-skills" class="h-full hidden overflow-y-auto p-10 max-w-6xl mx-auto">
                <h1 class="text-4xl font-bold text-white tracking-tight mb-10">Agent Capabilities</h1>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="skills-list"></div>
            </div>

            <!-- Logs Page -->
            <div id="page-logs" class="h-full hidden flex flex-col p-10">
                <h1 class="text-4xl font-bold text-white tracking-tight mb-8">System Console</h1>
                <div id="terminal-container" class="flex-1 border border-white/10 shadow-2xl rounded-2xl"></div>
            </div>

            <!-- API Config Page -->
            <div id="page-api" class="h-full hidden overflow-y-auto p-10 max-w-4xl mx-auto">
                <h1 class="text-4xl font-bold text-white tracking-tight mb-10">Control Center</h1>
                <div class="grid gap-8">
                    <div class="config-card space-y-6">
                        <div class="flex items-center gap-4 border-b border-white/5 pb-4">
                            <div class="p-3 bg-emerald-500/20 rounded-xl text-emerald-500"><i data-lucide="key" class="w-6 h-6"></i></div>
                            <h3 class="text-xl font-bold text-white">API Keys</h3>
                        </div>
                        <div class="space-y-4">
                            <div><label class="block text-xs font-bold text-gray-400 uppercase mb-2">Groq Keys</label><input type="password" id="input-groq" placeholder="key1,key2..."></div>
                            <div><label class="block text-xs font-bold text-gray-400 uppercase mb-2">Google Keys</label><input type="password" id="input-google" placeholder="key1,key2..."></div>
                            <div><label class="block text-xs font-bold text-gray-400 uppercase mb-2">HF Token</label><input type="password" id="input-hf" placeholder="hf_..."></div>
                        </div>
                        <button onclick="saveEnv()" class="w-full emerald-bg text-white font-bold py-4 rounded-xl shadow-xl hover:opacity-90 transition-all flex items-center justify-center gap-2">
                            <i data-lucide="save" class="w-5 h-5"></i> Save & Restart
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        // The __MONEY_MAKER_SESSION_TOKEN__ will be patched by Dockerfile from __MONEY_MAKER_SESSION_TOKEN__
        const token = window.__MONEY_MAKER_SESSION_TOKEN__ || '';
        let currentPage = 'chat';
        const pages = ['chat', 'skills', 'logs', 'api'];
        let mainTerm, logTerm, mainSocket;

        async function apiFetch(path, options = {}) {
            // Header must match patched backend header: X-MoneyMaker-Session-Token
            const headers = { ...options.headers, 'X-MoneyMaker-Session-Token': token };
            const resp = await fetch(path, { ...options, headers });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            return resp.json();
        }

        function initTerminals() {
            mainTerm = new Terminal({ theme: { background: '#000000', foreground: '#ffffff' }, fontSize: 14, cursorBlink: true });
            const fitAddon = new FitAddon.FitAddon();
            mainTerm.loadAddon(fitAddon);
            mainTerm.open(document.getElementById('terminal-chat-container'));
            fitAddon.fit();

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${location.host}/api/pty?token=${token}`;
            mainSocket = new WebSocket(wsUrl);
            mainSocket.onopen = () => { updateStatus('connected'); mainTerm.writeln('\x1b[1;32mMONEY MAKER ACTIVE\x1b[0m'); };
            mainSocket.onmessage = async (ev) => {
                if (ev.data instanceof Blob) mainTerm.write(new Uint8Array(await ev.data.arrayBuffer()));
                else mainTerm.write(ev.data);
            };
            mainTerm.onData(data => mainSocket.send(data));

            logTerm = new Terminal({ theme: { background: '#000000', foreground: '#10b981' }, fontSize: 12 });
            const logFit = new FitAddon.FitAddon();
            logTerm.loadAddon(logFit);
            logTerm.open(document.getElementById('terminal-container'));
            logFit.fit();

            window.addEventListener('resize', () => { fitAddon.fit(); logFit.fit(); });
            setInterval(updateLogs, 5000);
            updateLogs();
        }

        async function updateLogs() {
            if (currentPage !== 'logs' || !logTerm) return;
            try {
                const status = await apiFetch('/api/status');
                const logPath = `${status.MONEY_MAKER_HOME || status.hermes_home}/agent.log`;
                const data = await apiFetch(`/api/fs/read-text?path=${encodeURIComponent(logPath)}`);
                if (data && data.text) { logTerm.clear(); logTerm.write(data.text.split('\n').slice(-100).join('\r\n')); }
            } catch (e) { }
        }

        function updateStatus(state) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            if (state === 'connected') {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]';
                text.innerText = 'ONLINE';
                text.className = 'text-xs font-bold text-emerald-500';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-red-500';
                text.innerText = 'OFFLINE';
            }
        }

        function showPage(pageId) {
            pages.forEach(p => {
                document.getElementById(`page-${p}`).classList.add('hidden');
                document.getElementById(`btn-${p}`).classList.remove('tab-active', 'text-white');
            });
            document.getElementById(`page-${pageId}`).classList.remove('hidden');
            document.getElementById(`btn-${pageId}`).classList.add('tab-active', 'text-white');
            currentPage = pageId;
            if (pageId === 'skills') loadSkills();
            setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 50);
        }

        async function loadSkills() {
            const list = document.getElementById('skills-list');
            list.innerHTML = '<div class="col-span-full py-10 flex justify-center"><div class="animate-spin w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full"></div></div>';
            try {
                const skills = await apiFetch('/api/skills');
                list.innerHTML = '';
                skills.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'skill-card rounded-2xl p-6 flex flex-col gap-4';
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="p-3 bg-white/5 rounded-xl text-emerald-500"><i data-lucide="zap" class="w-6 h-6"></i></div>
                            <div class="text-[10px] uppercase font-black tracking-widest text-emerald-500 bg-emerald-500/10 px-3 py-1 rounded-full">Active</div>
                        </div>
                        <h4 class="font-bold text-xl text-white">${s.name}</h4>
                        <p class="text-sm text-gray-400 line-clamp-2">${s.description || 'Custom module.'}</p>
                    `;
                    list.appendChild(card);
                });
                lucide.createIcons();
            } catch (e) { list.innerHTML = `<p class="text-red-400">Error: ${e.message}</p>`; }
        }

        async function saveEnv() {
            const keys = {
                'GROQ_API_KEY': document.getElementById('input-groq').value,
                'GOOGLE_API_KEY': document.getElementById('input-google').value,
                'HF_TOKEN': document.getElementById('input-hf').value
            };
            try {
                for (const [k, v] of Object.entries(keys)) {
                    if (v.trim()) {
                        await apiFetch('/api/env', { method: 'PUT', body: JSON.stringify({ key: k, value: v.trim() }), headers: { 'Content-Type': 'application/json' } });
                    }
                }
                alert("Settings saved. Restarting agent...");
                await apiFetch('/api/gateway/restart', { method: 'POST' });
                setTimeout(() => location.reload(), 2000);
            } catch (e) { alert("Save failed: " + e.message); }
        }

        initTerminals();
        showPage('chat');
    </script>
</body>
</html>
